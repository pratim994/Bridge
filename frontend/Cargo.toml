[package]
name = "bridge-room-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]

# UI
leptos = { version = "0.8", features = ["csr"] }

# WASM / Browser
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "Navigator",

    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",

    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",

    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnectionIceEvent",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcTrackEvent",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Browser utilities
gloo-net = "0.6"
gloo-timers = "0.3"

# IDs
uuid = { version = "1", features = ["v4", "js"] }

# Errors
thiserror = "2"

# Logging / debugging
log = "0.4"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
